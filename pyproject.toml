[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantguard-ai"
version = "1.0.0"
description = "AI-powered plant disease research & monitoring platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Khattab" }]

[tool.setuptools.packages.find]
include = ["plantguard*"]

# ---------------------------------------------------------------------------
# Linting & formatting (ROADMAP [6.5])
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by the formatter

[tool.black]
line-length = 100
target-version = ["py311"]

# ---------------------------------------------------------------------------
# Tests (ROADMAP [6.3])
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
